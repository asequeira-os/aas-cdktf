name: No secrets in commits

# This will be duplicated in all git repos until I find a solution.

on:
  push:

jobs:
  check-no-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v6.0.2
      - name: run gitleaks
        run: |
          docker run --rm -v "`pwd`:/path" zricethezav/gitleaks:v8.30.1 detect --source="/path" -v
      - name: Scan using tartufo
        uses: godaddy/tartufo-action@v4.0.1
